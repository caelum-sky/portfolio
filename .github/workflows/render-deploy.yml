# .github/workflows/render-deploy.yml
name: Deploy Backend → Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/render-deploy.yml"

permissions:
  contents: read

concurrency:
  group: render-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not configured."
            exit 1
          fi

          http_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json")

          if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 300 ]; then
            echo "Render deploy triggered (HTTP $http_status)."
          else
            echo "::error::Render deploy hook failed with HTTP $http_status"
            exit 1
          fi